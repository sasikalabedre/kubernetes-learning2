apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: traffic-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
        - name: oom-demo
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 300Mi
